[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opm_unshear"
version = "0.1.0"
description = "Oblique interpolation (unshearing / deskewing) for oblique plane microscopy"
authors = [
    { name = "jlab.berlin" },
    { name = "Maximilian Hoffmann" },
    { name = "Benjamin Judkewitz" },
]
license = {text = "MIT"}
readme = "README.md"
keywords = ["opm_unshear", "python", "oblique plane microscopy", "deskew", "unshear"]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "numba",
]

[project.optional-dependencies]
# GPU support. If you use conda (see environment.yml), install cupy from conda-forge instead of this extra.
gpu = ["cupy-cuda12x"]
# command line interface (python -m opm_unshear)
cli = ["h5py", "hdf5plugin", "tifffile", "scipy"]
test = ["pytest", "h5py", "hdf5plugin", "tifffile", "scipy"]

[project.urls]
Homepage = "https://github.com/danionella/opm_unshear"

[tool.setuptools.packages.find]
where = ["src"]
include = ["opm_unshear*"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.black]
line-length = 120
skip_magic_trailing_comma = true